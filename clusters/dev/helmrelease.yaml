apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fastapi-dev
spec:
  interval: 5m
  releaseName: fastapi-dev

  chart:
    spec:
      chart: fastapi-app
      sourceRef:
        kind: GitRepository
        name: fastapi-helm-repo

  values:
    image:
      repository: ghcr.io/pauldjmetsi/fastapi-docker-app
      tag: "2c173431aee1e0ca5d176e323d57d970312d0d48"

    env:
      APP_ENV: dev
      APP_NAME: fastapi-dev
      FEATURE_FLAG: "true"

    secret:
      API_KEY: "dev-secret"

    ingress:
      enabled: true
      className: kommander-traefik
      issuer: selfsigned-issuer
      appName: fastapi
      environment: dev
      nipDomain: "10.2.0.151.nip.io"
      tlsSecret: fastapi-dev-tls